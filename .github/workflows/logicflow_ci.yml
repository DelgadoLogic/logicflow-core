name: LogicFlow CI

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build & Test
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore LogicFlow.sln

      - name: Build (Release)
        run: dotnet build LogicFlow.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LogicFlow.sln --configuration Release --no-build --verbosity normal

      - name: Publish Dashboard
        shell: pwsh
        run: |
          dotnet publish src/LogicFlow.Dashboard/LogicFlow.Dashboard.csproj `
            --configuration Release `
            --output ./publish/dashboard `
            --self-contained false

  # Node Backend Tests (Cloud Functions & Telemetry Ingest)
  node-backend:
    name: Node Functions & Telemetry Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test Cloud Functions
        run: |
          npm --prefix functions ci
          npm --prefix functions test

      - name: Test Telemetry Ingest
        run: |
          npm --prefix Infrastructure/telemetry-ingest ci
          npm --prefix Infrastructure/telemetry-ingest test

  # Release: Draft GitHub Release & publish sovereign update manifest
  release:
    name: Publish Release & Sovereign Manifest
    needs: [build, node-backend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true

      - name: Publish update manifest to sovereign server
        env:
          CI_TOKEN: ${{ secrets.AEON_CI_PUBLISH_SECRET }}
          UPDATE_SERVER: ${{ secrets.AEON_UPDATE_SERVER_URL }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$CI_TOKEN" ] || [ -z "$UPDATE_SERVER" ]; then
            echo "Production manifest secrets are not configured in environment 'production'."
            exit 1
          fi
          curl -sf -X POST "$UPDATE_SERVER/v1/manifest/publish" \
            -H "Authorization: Bearer $CI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"product\": \"logicflow\",
              \"channel\": \"stable\",
              \"version\": \"$VERSION\",
              \"tag\": \"v$VERSION\",
              \"release_url\": \"https://github.com/DelgadoLogic/logicflow-core/releases/tag/v$VERSION\",
              \"min_os\": \"windows-10-x64\",
              \"status\": \"available\"
            }"
          echo "Manifest published for LogicFlow v$VERSION"

      - name: Verify manifest is live + signed
        env:
          UPDATE_SERVER: ${{ secrets.AEON_UPDATE_SERVER_URL }}
        run: |
          echo "Verifying sovereign manifest..."
          curl -sf "$UPDATE_SERVER/v1/update/logicflow/stable" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print('Version:', data['manifest']['version'])
          print('Signature:', data['signature'][:32], '...')
          print('Manifest is live and signed')
          "
