version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        versions: [">= 11.0.0"]
      - dependency-name: "NAudio*"
        versions: [">= 3.0.0"]
    labels: ["dependencies", "dotnet"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-functions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "firebase-admin"
        versions: [">= 13.0.0"]
      - dependency-name: "firebase-functions"
        versions: [">= 6.0.0"]
    labels: ["dependencies", "functions"]
    commit-message:
      prefix: "deps(functions)"
